services:
    # MongoDB
  mongodb:
    image: mongo:6
    container_name: emacare-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: emacare
    ports:
      - '27018:27017'
    volumes:
      - mongodb_data:/data/db
    networks:
      - emacare-network

  # Redis for Cart Service
  redis:
    image: redis:7-alpine
    container_name: emacare-redis
    ports:
      - '6380:6379'
    volumes:
      - redis_data:/data
    networks:
      - emacare-network
  vault:
    image: hashicorp/vault:1.15.1
    container_name: vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root-token
    command: server -dev -dev-root-token-id=root-token -dev-listen-address=0.0.0.0:8200
    ports:
      - "8203:8200"
    volumes:
      - vault_data:/vault/file
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          "wget --spider -q http://localhost:8200/v1/sys/health || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
  api-gateway:
    image: ${AWS_ACCOUNT_ID:-645311222502}.dkr.ecr.${AWS_REGION:-us-east-1}.amazonaws.com/emacare/api-gateway:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      API_GATEWAY_PORT: "3000"
      MONGO_DB_URL: ${MONGO_DB_URL:?Set MONGO_DB_URL}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
      JWT_ENCRYPTION_KEY: ${JWT_ENCRYPTION_KEY:?Set JWT_ENCRYPTION_KEY}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      AUTH_SERVICE_URL: http://auth-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3002
      ORDER_SERVICE_URL: http://order-service:3003
      CART_SERVICE_URL: http://cart-service:3004
      PAYMENT_SERVICE_URL: http://payment-service:3005
      SHIPPING_SERVICE_URL: http://shipping-service:3006
      NOTIFICATION_SERVICE_URL: http://notification-service:3007
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const http=require('node:http');http.get('http://127.0.0.1:'+process.env.PORT+'/health',r=>{r.resume();process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      auth-service:
        condition: service_started
      product-service:
        condition: service_started
      order-service:
        condition: service_started
      cart-service:
        condition: service_started
      payment-service:
        condition: service_started
      shipping-service:
        condition: service_started
      notification-service:
        condition: service_started
    networks:
      - backend

  auth-service:
    image: ${AWS_ACCOUNT_ID:-645311222502}.dkr.ecr.${AWS_REGION:-us-east-1}.amazonaws.com/emacare/auth-service:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    logging: *default-logging
    expose:
      - "3001"
    environment:
      NODE_ENV: production
      PORT: "3001"
      AUTH_SERVICE_PORT: "3001"
      MONGO_DB_URL: ${MONGO_DB_URL:?Set MONGO_DB_URL}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
      JWT_ENCRYPTION_KEY: ${JWT_ENCRYPTION_KEY:?Set JWT_ENCRYPTION_KEY}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
    networks:
      - backend

  product-service:
    image: ${AWS_ACCOUNT_ID:-645311222502}.dkr.ecr.${AWS_REGION:-us-east-1}.amazonaws.com/emacare/product-service:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    logging: *default-logging
    expose:
      - "3002"
    environment:
      NODE_ENV: production
      PORT: "3002"
      PRODUCT_SERVICE_PORT: "3002"
      MONGO_DB_URL: ${MONGO_DB_URL:?Set MONGO_DB_URL}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
      JWT_ENCRYPTION_KEY: ${JWT_ENCRYPTION_KEY:?Set JWT_ENCRYPTION_KEY}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      SEAWEEDFS_FILER_URL: http://seaweedfs:8888
      SEAWEEDFS_PUBLIC_URL: ${SEAWEEDFS_PUBLIC_URL:?Set the public HTTPS media URL}
      SEAWEEDFS_FOLDER_NAME: ${SEAWEEDFS_FOLDER_NAME:-emacare_files}
    depends_on:
      seaweedfs:
        condition: service_started
    networks:
      - backend

  order-service:
    image: ${AWS_ACCOUNT_ID:-645311222502}.dkr.ecr.${AWS_REGION:-us-east-1}.amazonaws.com/emacare/order-service:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    logging: *default-logging
    expose:
      - "3003"
    environment:
      NODE_ENV: production
      PORT: "3003"
      ORDER_SERVICE_PORT: "3003"
      MONGO_DB_URL: ${MONGO_DB_URL:?Set MONGO_DB_URL}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
      JWT_ENCRYPTION_KEY: ${JWT_ENCRYPTION_KEY:?Set JWT_ENCRYPTION_KEY}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
    networks:
      - backend

  cart-service:
    image: ${AWS_ACCOUNT_ID:-645311222502}.dkr.ecr.${AWS_REGION:-us-east-1}.amazonaws.com/emacare/cart-service:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    logging: *default-logging
    expose:
      - "3004"
    environment:
      NODE_ENV: production
      PORT: "3004"
      CART_SERVICE_PORT: "3004"
      MONGO_DB_URL: ${MONGO_DB_URL:?Set MONGO_DB_URL}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
      JWT_ENCRYPTION_KEY: ${JWT_ENCRYPTION_KEY:?Set JWT_ENCRYPTION_KEY}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
    networks:
      - backend

  payment-service:
    image: ${AWS_ACCOUNT_ID:-645311222502}.dkr.ecr.${AWS_REGION:-us-east-1}.amazonaws.com/emacare/payment-service:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    logging: *default-logging
    expose:
      - "3005"
    environment:
      NODE_ENV: production
      PORT: "3005"
      PAYMENT_SERVICE_PORT: "3005"
      MONGO_DB_URL: ${MONGO_DB_URL:?Set MONGO_DB_URL}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
      JWT_ENCRYPTION_KEY: ${JWT_ENCRYPTION_KEY:?Set JWT_ENCRYPTION_KEY}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?Set STRIPE_SECRET_KEY}
    networks:
      - backend

  shipping-service:
    image: ${AWS_ACCOUNT_ID:-645311222502}.dkr.ecr.${AWS_REGION:-us-east-1}.amazonaws.com/emacare/shipping-service:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    logging: *default-logging
    expose:
      - "3006"
    environment:
      NODE_ENV: production
      PORT: "3006"
      SHIPPING_SERVICE_PORT: "3006"
      MONGO_DB_URL: ${MONGO_DB_URL:?Set MONGO_DB_URL}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
      JWT_ENCRYPTION_KEY: ${JWT_ENCRYPTION_KEY:?Set JWT_ENCRYPTION_KEY}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      DHL_API_KEY: ${DHL_API_KEY:?Set DHL_API_KEY}
    networks:
      - backend

  notification-service:
    image: ${AWS_ACCOUNT_ID:-645311222502}.dkr.ecr.${AWS_REGION:-us-east-1}.amazonaws.com/emacare/notification-service:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    logging: *default-logging
    expose:
      - "3007"
    environment:
      NODE_ENV: production
      PORT: "3007"
      NOTIFICATION_SERVICE_PORT: "3007"
      MONGO_DB_URL: ${MONGO_DB_URL:?Set MONGO_DB_URL}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
      JWT_ENCRYPTION_KEY: ${JWT_ENCRYPTION_KEY:?Set JWT_ENCRYPTION_KEY}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      EMAIL_USER: ${EMAIL_USER:?Set EMAIL_USER}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:?Set EMAIL_PASSWORD}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:?Set TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:?Set TWILIO_AUTH_TOKEN}
    networks:
      - backend

  seaweedfs:
    image: ${SEAWEEDFS_IMAGE:?Set SEAWEEDFS_IMAGE to a pinned image version}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    command: ["server", "-dir=/data", "-filer=true"]
    ports:
      - "8888:8888"
    volumes:
      - seaweedfs_data:/data
    networks:
      - backend

volumes:
  seaweedfs_data:

networks:
  backend:
    driver: bridge
